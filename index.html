<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yash - Portfolio Under Construction</title>
    <meta
      name="description"
      content="Portfolio under construction. Crafting a digital masterpiece. Check back soon."
    />
    <link rel="icon" type="image/png" href="public/favicon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="script.js"></script>
    <script src="cursor.js"></script>
  </head>
  <body>
    <div id="cursor-dot"></div>
    <div id="cursor-outline"></div>
    <div class="grain-overlay"></div>
    
    <!-- Dynamic Background -->
    <!-- <div class="bg-grid"></div> -->
    <div class="glow-orb orb-1" id="orb1"></div>
    <div class="glow-orb orb-2" id="orb2"></div>
    <div class="glow-orb orb-3" id="orb3"></div>

    <div class="split-container">
      <!-- Left Section -->
      <div class="left-section">
            <div class="text-overlays">
                <div class="title-container">
                    <div class="col-you-are">
                        <div class="rotated-text orange">ARE</div>
                        <div class="rotated-text orange">YOU</div>
                    </div>
                    <div class="col-the">
                        <div class="rotated-text dark-bold">THE</div>
                    </div>
                    <div class="col-stack">
                        <div class="stack-line dark">STONE,</div>
                        <div class="stack-line dark">CHISEL &</div>
                        <div class="stack-line orange">SCULPTURE</div>
                    </div>
                </div>
            </div>

        <div class="model-container" id="canvas-container">
            <div id="loader" class="loader-container">
                <div class="cube-loader">
                    <div class="cube-face front"></div>
                    <div class="cube-face back"></div>
                    <div class="cube-face right"></div>
                    <div class="cube-face left"></div>
                    <div class="cube-face top"></div>
                    <div class="cube-face bottom"></div>
                </div>
                <div class="particle p1"></div>
                <div class="particle p2"></div>
                <div class="particle p3"></div>
                <div class="particle p4"></div>
            </div>
            <!-- Three.js canvas will be injected here -->
        </div>
      </div>

      <!-- Right Section -->
      <div class="right-section">
        <div class="content-wrapper">
          <div class="top-bar">
            <div class="status-badge">PORTFOLIO UNDER CONSTRUCTION</div>
          </div>

          <div class="brand-section">
            <img src="public/yash.png" alt="Yash Logo" class="brand-logo" />
          </div>

          <div class="hero-section">
            <h1>Crafting a digital masterpiece.</h1>
            <p class="subtext">
              I am currently architecting my new portfolio. <br />
              <span class="highlight-text">Check back soon for the full reveal.</span>
            </p>
          </div>

          <div class="contact-section">
            <h2>CONTACT ME</h2>
            <div class="contact-icons">
              <a href="tel:+919537694168" aria-label="Phone"
                ><i class="fas fa-phone-alt"></i
              ></a>
              <a href="mailto:yrp.baps@gmail.com" aria-label="Email"><i class="fas fa-envelope"></i></a>
              <a href="https://www.linkedin.com/in/yash-patel-92a334113" target="_blank" aria-label="LinkedIn"
                ><i class="fab fa-linkedin-in"></i
              ></a>
            </div>
            
            <a href="/resume" class="btn-gold">
                RESUME <i class="fas fa-arrow-right" style="font-size: 0.8em; margin-left: 5px;"></i>
            </a>
          </div>

        </div>

        <div class="selected-work-section">
            <h1>SELECTED WORK</h1>
            <div class="work-showcase">
                <a href="https://pub.dev/packages/kflavor" target="_blank" class="work-item">
                    <img src="public/kflavor.png" alt="kflavor" />
                </a>
                <a href="https://regenx.iamyash.in/" target="_blank" class="work-item">
                    <img src="public/regenx.png" alt="REGENX" />
                </a>
                <a href="https://components.iamyash.in/" target="_blank" class="work-item">
                    <img src="public/components.png" alt="Component Library" />
                </a>
                <div class="work-item placeholder">
                    <div class="placeholder-content">
                        <span>More Work</span>
                        <span class="coming-soon">COMING SOON</span>
                    </div>
                </div>
            </div>
        </div>
      </div>
    </div>
  </body>
</html>
